name: meterya
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare-local.ps1 first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-meterya.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  keycloak:
    build: ./keycloak
    image: meterya-keycloak:local
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: operator
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?}
      KC_HTTP_RELATIVE_PATH: /identity
      KC_HOSTNAME: http://localhost:8080/identity
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - ./keycloak/generated-realm.json:/opt/keycloak/data/import/meterya-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  api:
    build: ..
    environment:
      DATABASE_URL: postgres://meterya:${APP_DB_PASSWORD:?}@postgres/meterya?sslmode=disable
      PUBLIC_ORIGIN: http://localhost:8080
      OIDC_ISSUER: http://localhost:8080/identity/realms/meterya
      OIDC_INTERNAL_BASE: http://keycloak:8080/identity
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      KEYCLOAK_SERVICE_SECRET: ${KEYCLOAK_SERVICE_SECRET:?}
      # Local demo operator; set a verified Keycloak subject for other deployments.
      OPERATOR_SUBJECT: ${OPERATOR_SUBJECT:-11111111-1111-4111-8111-111111111111}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped
  gateway:
    image: caddy:2
    ports: [127.0.0.1:8080:8080]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../meterya-app/build/web:/srv:ro
    depends_on: [api, keycloak]
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.29
    ports: [127.0.0.1:8025:8025]
    restart: unless-stopped
  test:
    profiles: [test]
    build:
      context: ..
      target: test
    environment:
      TEST_DATABASE_URL: postgres://meterya:${APP_DB_PASSWORD:?}@postgres/meterya?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
